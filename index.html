<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />

    <!-- Keyword-led rather than name-led: the domain is already an exact match
         for anyone searching the name, so the title is spent on the terms
         someone looking to hire actually types. -->
    <title>Freelance Web Designer — Personal &amp; Small Business Websites · Christian Kamalu</title>
    <meta
      name="description"
      content="I design and build websites for people and small businesses — personal sites, small business sites, and rebuilds. Hand-written, fast, and yours to own outright."
    />
    <link rel="canonical" href="https://www.christiankamalu.com/" />
    <meta name="author" content="Christian Kamalu" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Christian Kamalu" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://www.christiankamalu.com/" />
    <meta property="og:title" content="Websites for people &amp; small businesses — Christian Kamalu" />
    <meta
      property="og:description"
      content="I design, build, and ship websites — hand-written, quick to load, and yours to own outright."
    />
    <meta property="og:image" content="https://www.christiankamalu.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Christian Kamalu — websites for people and small businesses" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Websites for people &amp; small businesses — Christian Kamalu" />
    <meta
      name="twitter:description"
      content="I design, build, and ship websites — hand-written, quick to load, and yours to own outright."
    />
    <meta name="twitter:image" content="https://www.christiankamalu.com/og-image.png" />

    <!-- The JSON-LD graph is injected here at build time from SITE in
         src/data.ts — see the structuredData plugin in vite.config.ts. -->

    <!-- Marks that JS is running, before anything paints. The reveal-on-scroll
         styles hang off `.js` so that a reader without JS gets the prerendered
         page in full rather than a blank one — see .reveal in styles.css. A
         <noscript> style block is the usual trick here and is not reliable:
         whether its contents apply depends on the parser's scripting flag,
         not on whether script actually ran. -->
    <script>
      document.documentElement.classList.add('js');
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: a third-party stylesheet in the critical path delays
         first paint by a whole network round trip. `display=swap` already
         means the fallback stack renders first, so this only moves the swap
         earlier — it does not add a flash that wasn't there. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden twin of the React contact form. Netlify detects forms from the
         deployed HTML at build time; the real form is in there because the
         page is prerendered, but if prerendering ever regresses, detection
         would fail silently and submissions would 404 with nothing logged.
         Keep this field list identical to ContactForm.tsx — Netlify only
         accepts fields it saw at deploy time. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="form-name" value="contact" />
      <input name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
